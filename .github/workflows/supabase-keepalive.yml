name: Supabase Keep-Alive Ping

on:
  schedule:
    # Se ejecuta todos los días cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via API
        run: |
          if [ -n "${{ secrets.APP_PRODUCTION_URL }}" ]; then
            echo "Enviando ping a ${{ secrets.APP_PRODUCTION_URL }}/api/keep-alive"
            curl -s -f -X GET "${{ secrets.APP_PRODUCTION_URL }}/api/keep-alive" || echo "Warning: ping response error"
          elif [ -n "${{ secrets.SUPABASE_URL }}" ] && [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Enviando ping directo a REST API de Supabase"
            curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || echo "Warning: Supabase REST ping error"
          else
            echo "No se configuraron secretos de Supabase aún. Ping omitido."
          fi
